<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Praia no Pote</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: monospace;
}

canvas {
  display: block;
  margin: auto;
}
</style>
</head>

<body>
<canvas id="gameCanvas" width="712" height="400"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// NOVO TAMANHO (mais presença)
const gameWidth = 360;
const gameHeight = canvas.height;
const gameX = (canvas.width - gameWidth) / 2;
const gameY = 0;

const laneWidth = gameWidth / 3;

let state = "start";

let player = null;
let obstacles = [];
let speed = 2;
let score = 0;
let spawnTimer = 0;
let spawnInterval = 90;
let scoreTimer = 0;
let deathTimer = 0;
let blinkTimer = 0;

let decorations = [];

function generateDecorations() {
  decorations = [];

  for (let i = 0; i < 30; i++) {
    decorations.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      type: Math.random() > 0.75 ? "palm" : "rock"
    });
  }
}
generateDecorations();

function resetGame() {
  player = {
    lane: 1,
    targetLane: 1,
    x: gameX + laneWidth * 1 + laneWidth/2,
    y: canvas.height - 60,
    baseY: canvas.height - 60,
    size: 22,
    isSkeleton: false,
    opacity: 1
  };

  obstacles = [];
  speed = 2;
  score = 0;
  spawnTimer = 0;
  spawnInterval = 90;
  scoreTimer = 0;
  deathTimer = 0;
}

function spawnRow() {
  const patterns = [
    [1,0,1],
    [0,1,0],
    [1,0,0],
    [0,0,1],
    [0,1,1],
    [1,1,0]
  ];

  const pattern = patterns[Math.floor(Math.random() * patterns.length)];

  for (let lane = 0; lane < 3; lane++) {
    if (pattern[lane]) {
      obstacles.push({
        lane,
        y: -30,
        size: 22
      });
    }
  }
}

document.addEventListener("keydown", e => {
  if (state !== "playing") return;

  if (e.key === "ArrowLeft" && player.targetLane > 0) player.targetLane--;
  if (e.key === "ArrowRight" && player.targetLane < 2) player.targetLane++;
});

canvas.addEventListener("click", () => {
  if (state === "start" || state === "gameOver") {
    resetGame();
    state = "playing";
  }
});

function drawBackground() {
  ctx.fillStyle = "#e6d3a3";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // textura leve
  for (let i = 0; i < canvas.width; i += 6) {
    for (let j = 0; j < canvas.height; j += 6) {
      ctx.fillStyle = Math.random() > 0.5 ? "#e6d3a3" : "#dcc690";
      ctx.fillRect(i, j, 6, 6);
    }
  }

  // elementos maiores (menos distantes)
  for (let d of decorations) {

    if (
      d.x > gameX &&
      d.x < gameX + gameWidth
    ) continue;

    if (d.type === "rock") {
      ctx.fillStyle = "#777";
      ctx.beginPath();
      ctx.arc(d.x, d.y, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    if (d.type === "palm") {
      ctx.fillStyle = "#8b5a2b";
      ctx.fillRect(d.x, d.y, 3, 14);

      ctx.strokeStyle = "#2f8f3a";
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(d.x + 1, d.y);
      ctx.lineTo(d.x - 8, d.y - 6);
      ctx.moveTo(d.x + 1, d.y);
      ctx.lineTo(d.x + 8, d.y - 6);
      ctx.moveTo(d.x + 1, d.y);
      ctx.lineTo(d.x - 5, d.y - 10);
      ctx.moveTo(d.x + 1, d.y);
      ctx.lineTo(d.x + 5, d.y - 10);
      ctx.stroke();
    }
  }
}

function drawWater() {
  for (let y = 0; y < gameHeight; y += 12) {
    ctx.fillStyle = y % 24 === 0 ? "#2fa4b7" : "#2895a6";
    ctx.fillRect(gameX, y, gameWidth, 12);
  }
}

function drawFish() {
  if (!player) return;

  ctx.globalAlpha = player.opacity;

  ctx.fillStyle = player.isSkeleton ? "#ccc" : "#e6f7ff";

  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size/2, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = player.isSkeleton ? "#999" : "#fff";
  ctx.fillRect(player.x - 7, player.y, 7, 5);

  ctx.globalAlpha = 1;
}

function drawOil(o) {
  let x = gameX + o.lane * laneWidth + laneWidth/2;

  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.ellipse(x, o.y, 16, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#444";
  ctx.beginPath();
  ctx.ellipse(x - 4, o.y - 2, 6, 3, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawStart() {
  ctx.fillStyle = "black";
  ctx.textAlign = "center";

  ctx.font = "28px monospace";
  ctx.fillText("PRAIA NO POTE", canvas.width/2, canvas.height/2 - 20);

  ctx.font = "16px monospace";

  if (Math.floor(blinkTimer / 30) % 2 === 0) {
    ctx.fillText("clique para começar", canvas.width/2, canvas.height/2 + 20);
  }
}

function drawGameOver() {
  ctx.fillStyle = "black";
  ctx.textAlign = "center";

  ctx.font = "26px monospace";
  ctx.fillText("GAME OVER", canvas.width/2, canvas.height/2 - 20);

  ctx.font = "16px monospace";
  ctx.fillText("score: " + score, canvas.width/2, canvas.height/2 + 10);
}

function update() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  blinkTimer++;

  drawBackground();
  drawWater();

  if (state === "start") {
    drawStart();
    requestAnimationFrame(update);
    return;
  }

  if (player) {
    let targetX = gameX + player.targetLane * laneWidth + laneWidth/2;
    player.x += (targetX - player.x) * 0.2;
  }

  for (let o of obstacles) {
    if (state === "playing") o.y += speed;
    drawOil(o);

    if (
      state === "playing" &&
      o.lane === player.targetLane &&
      o.y > player.y - 10 &&
      o.y < player.y + 10
    ) {
      state = "dying";
      deathTimer = 0;
    }
  }

  obstacles = obstacles.filter(o => o.y < canvas.height);

  if (state === "playing") {
    spawnTimer++;
    if (spawnTimer > spawnInterval) {
      spawnRow();
      spawnTimer = 0;
    }

    scoreTimer++;
    if (scoreTimer > 180) {
      score++;
      scoreTimer = 0;
    }

    speed += 0.00015;
  }

  if (state === "dying") {
    deathTimer++;

    if (deathTimer < 40) player.y += 2;
    else if (deathTimer < 70) player.opacity -= 0.03;
    else if (deathTimer < 120) {
      if (!player.isSkeleton) {
        player.isSkeleton = true;
        player.y = player.baseY + 20;
        player.opacity = 1;
      }
      player.y -= 0.6;
    } else state = "gameOver";
  }

  drawFish();

  if (state === "playing" || state === "dying") {
    ctx.fillStyle = "black";
    ctx.fillText("score: " + score, gameX + 10, 20);
  }

  if (state === "gameOver") drawGameOver();

  requestAnimationFrame(update);
}

update();
</script>
</body>
</html>
