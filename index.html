<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Praia no Pote</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: monospace;
      color: white;
    }

    canvas {
      display: block;
      margin: auto;
      background: #111;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="712" height="400"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// área do jogo (vertical dentro do 16:9)
const gameWidth = 300;
const gameHeight = 500;
const gameX = (canvas.width - gameWidth) / 2;
const gameY = (canvas.height - gameHeight) / 2;

const laneWidth = gameWidth / 3;

let state = "start";

let player, obstacles, speed, score;

function resetGame() {
  player = {
    lane: 1,
    y: gameY + gameHeight - 80,
    size: 30
  };

  obstacles = [];
  speed = 2;
  score = 0;
}

function spawnObstacle() {
  const lane = Math.floor(Math.random() * 3);
  obstacles.push({
    lane: lane,
    y: gameY - 50,
    size: 30
  });
}

document.addEventListener("keydown", (e) => {
  if (state !== "playing") return;

  if (e.key === "ArrowLeft" && player.lane > 0) {
    player.lane--;
  }
  if (e.key === "ArrowRight" && player.lane < 2) {
    player.lane++;
  }
});

canvas.addEventListener("click", () => {
  if (state === "start") {
    resetGame();
    state = "playing";
  } else if (state === "gameOver") {
    resetGame();
    state = "playing";
  }
});

function drawStartScreen() {
  ctx.fillStyle = "white";
  ctx.textAlign = "center";

  ctx.font = "40px monospace";
  ctx.fillText("PRAIA NO POTE", canvas.width / 2, canvas.height / 2 - 40);

  ctx.font = "20px monospace";
  ctx.fillText("clique para começar", canvas.width / 2, canvas.height / 2 + 20);
}

function drawGameOver() {
  ctx.fillStyle = "white";
  ctx.textAlign = "center";

  ctx.font = "30px monospace";
  ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);

  ctx.font = "20px monospace";
  ctx.fillText("score: " + score, canvas.width / 2, canvas.height / 2 + 20);

  ctx.fillText("clique para jogar novamente", canvas.width / 2, canvas.height / 2 + 60);
}

function update() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // fundo geral (16:9)
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // área do jogo (centro)
  ctx.fillStyle = "#111";
  ctx.fillRect(gameX, gameY, gameWidth, gameHeight);

  if (state === "start") {
    drawStartScreen();
    requestAnimationFrame(update);
    return;
  }

  if (state === "playing") {
    let px = gameX + player.lane * laneWidth + laneWidth/2 - player.size/2;
    ctx.fillStyle = "white";
    ctx.fillRect(px, player.y, player.size, player.size);

    for (let i = 0; i < obstacles.length; i++) {
      let o = obstacles[i];
      let ox = gameX + o.lane * laneWidth + laneWidth/2 - o.size/2;

      o.y += speed;

      ctx.fillStyle = "red";
      ctx.fillRect(ox, o.y, o.size, o.size);

      if (
        o.lane === player.lane &&
        o.y + o.size > player.y &&
        o.y < player.y + player.size
      ) {
        state = "gameOver";
      }
    }

    obstacles = obstacles.filter(o => o.y < gameY + gameHeight);

let spawnTimer = 0;
let spawnInterval = 90; // quanto maior = mais espaço

function spawnRow() {
  // padrões possíveis (sempre com caminho livre)
  const patterns = [
    [1,0,1],
    [0,1,0],
    [1,0,0],
    [0,0,1],
    [0,1,1],
    [1,1,0]
  ];

  const pattern = patterns[Math.floor(Math.random() * patterns.length)];

  for (let lane = 0; lane < 3; lane++) {
    if (pattern[lane] === 1) {
      obstacles.push({
        lane: lane,
        y: gameY - 50,
        size: 30
      });
    }
  }
}

    score++;
    speed += 0.0005;

    ctx.fillStyle = "white";
    ctx.textAlign = "left";
    ctx.fillText("score: " + score, gameX + 10, gameY + 20);
  }

  if (state === "gameOver") {
    drawGameOver();
  }

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
