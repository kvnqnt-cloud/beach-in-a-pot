<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Praia no Pote</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: monospace;
      color: white;
    }

    canvas {
      display: block;
      margin: auto;
      background: #111;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="712" height="400"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const gameWidth = 220;
const gameHeight = 360;
const gameX = (canvas.width - gameWidth) / 2;
const gameY = (canvas.height - gameHeight) / 2;

const laneWidth = gameWidth / 3;

let state = "start";

let player, obstacles, speed, score;
let spawnTimer = 0;
let spawnInterval = 90;
let scoreTimer = 0;
let deathTimer = 0;
let blinkTimer = 0;

function resetGame() {
  player = {
    lane: 1,
    targetLane: 1,
    x: gameX + laneWidth * 1 + laneWidth/2 - 10,
    y: gameY + gameHeight - 60,
    baseY: gameY + gameHeight - 60,
    size: 20,
    isSkeleton: false,
    opacity: 1
  };

  obstacles = [];
  speed = 2;
  score = 0;
  spawnTimer = 0;
  spawnInterval = 90;
  scoreTimer = 0;
  deathTimer = 0;
}

function spawnRow() {
  const patterns = [
    [1,0,1],
    [0,1,0],
    [1,0,0],
    [0,0,1],
    [0,1,1],
    [1,1,0]
  ];

  const pattern = patterns[Math.floor(Math.random() * patterns.length)];

  for (let lane = 0; lane < 3; lane++) {
    if (pattern[lane] === 1) {
      obstacles.push({
        lane: lane,
        y: gameY - 30,
        size: 20
      });
    }
  }
}

document.addEventListener("keydown", (e) => {
  if (state !== "playing") return;

  if (e.key === "ArrowLeft" && player.targetLane > 0) player.targetLane--;
  if (e.key === "ArrowRight" && player.targetLane < 2) player.targetLane++;
});

canvas.addEventListener("click", () => {
  if (state === "start") {
    resetGame();
    state = "playing";
  } else if (state === "gameOver") {
    resetGame();
    state = "playing";
  }
});

function drawStartScreen() {
  ctx.fillStyle = "white";
  ctx.textAlign = "center";

  ctx.font = "28px monospace";
  ctx.fillText("PRAIA NO POTE", gameX + gameWidth/2, canvas.height/2 - 20);

  ctx.font = "14px monospace";
  if (Math.floor(blinkTimer / 30) % 2 === 0) {
    ctx.fillText("clique para começar", gameX + gameWidth/2, canvas.height/2 + 20);
  }
}

function drawGameOver() {
  ctx.fillStyle = "white";
  ctx.textAlign = "center";

  ctx.font = "24px monospace";
  ctx.fillText("GAME OVER", gameX + gameWidth/2, canvas.height/2 - 20);

  ctx.font = "14px monospace";
  ctx.fillText("score: " + score, gameX + gameWidth/2, canvas.height/2 + 10);

  ctx.fillText("clique para jogar novamente", gameX + gameWidth/2, canvas.height/2 + 40);
}

function update() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  blinkTimer++;

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#111";
  ctx.fillRect(gameX, gameY, gameWidth, gameHeight);

  if (state === "start") {
    drawStartScreen();
    requestAnimationFrame(update);
    return;
  }

  let targetX = gameX + player.targetLane * laneWidth + laneWidth/2 - player.size/2;
  player.x += (targetX - player.x) * 0.2;

  // OBSTÁCULOS
  for (let o of obstacles) {
    let ox = gameX + o.lane * laneWidth + laneWidth/2 - o.size/2;

    if (state === "playing") o.y += speed;

    ctx.fillStyle = "red";
    ctx.fillRect(ox, o.y, o.size, o.size);

    if (
      state === "playing" &&
      o.lane === player.targetLane &&
      o.y + o.size > player.y &&
      o.y < player.y + player.size
    ) {
      state = "dying";
      deathTimer = 0;
    }
  }

  obstacles = obstacles.filter(o => o.y < gameY + gameHeight);

  // PLAYER + MORTE
  ctx.globalAlpha = player.opacity;

  if (state === "dying") {
    deathTimer++;

    if (deathTimer < 40) {
      // afundando
      player.y += 1.5;
    } else if (deathTimer < 70) {
      // desaparecendo
      player.opacity -= 0.03;
    } else if (deathTimer < 120) {
      // volta como esqueleto
      if (!player.isSkeleton) {
        player.isSkeleton = true;
        player.y = player.baseY + 20;
        player.opacity = 1;
      }
      player.y -= 0.5; // sobe
    } else {
      state = "gameOver";
    }
  }

  // desenhar player
  ctx.fillStyle = player.isSkeleton ? "#ccc" : "white";
  ctx.fillRect(player.x, player.y, player.size, player.size);

  ctx.globalAlpha = 1;

  if (state === "playing") {
    spawnTimer++;
    if (spawnTimer > spawnInterval) {
      spawnRow();
      spawnTimer = 0;
    }

    if (spawnInterval > 55) spawnInterval -= 0.003;

    scoreTimer++;
    if (scoreTimer > 180) {
      score++;
      scoreTimer = 0;
    }

    speed += 0.00015;
  }

  if (state === "playing" || state === "dying") {
    ctx.fillStyle = "white";
    ctx.textAlign = "left";
    ctx.fillText("score: " + score, gameX + 10, gameY + 20);
  }

  if (state === "gameOver") {
    drawGameOver();
  }

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
