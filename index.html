<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Praia no Pote</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: monospace;
}

canvas {
  display: block;
  margin: auto;
}
</style>
</head>

<body>
<canvas id="gameCanvas" width="712" height="400"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// =================
// LAYOUT
// =================
const gameWidth = 360;
const gameHeight = canvas.height;
const gameX = (canvas.width - gameWidth) / 2;
const laneWidth = gameWidth / 3;

// =================
// ESTADO
// =================
let state = "start";

let player = null;
let obstacles = [];

let speed = 2;
let score = 0;

let spawnTimer = 0;
let spawnInterval = 90;

let scoreTimer = 0;
let deathTimer = 0;
let blinkTimer = 0;

// =================
// NAVIO
// =================
let tankerY = 0;

// =================
// DECORAÇÃO FIXA (praia)
// =================
let beachItems = [];

function generateBeach() {
  beachItems = [];

  for (let i = 0; i < 15; i++) {
    beachItems.push({
      x: canvas.width - 120 + Math.random() * 100,
      y: Math.random() * canvas.height,
      type: Math.random() > 0.6 ? "palm" : "rock"
    });
  }
}
generateBeach();

// =================
// RESET
// =================
function resetGame() {
  player = {
    lane: 1,
    targetLane: 1,
    x: gameX + laneWidth * 1 + laneWidth/2,
    y: canvas.height - 60,
    baseY: canvas.height - 60,
    size: 22,
    isSkeleton: false,
    opacity: 1
  };

  obstacles = [];
  speed = 2;
  score = 0;
  spawnTimer = 0;
  scoreTimer = 0;
  deathTimer = 0;
}

// =================
// SPAWN
// =================
function spawnRow() {
  const patterns = [
    [1,0,1],
    [0,1,0],
    [1,0,0],
    [0,0,1],
    [0,1,1],
    [1,1,0]
  ];

  const pattern = patterns[Math.floor(Math.random() * patterns.length)];

  for (let lane = 0; lane < 3; lane++) {
    if (pattern[lane]) {
      obstacles.push({
        lane,
        y: -30
      });
    }
  }
}

// =================
// INPUT
// =================
document.addEventListener("keydown", e => {
  if (state !== "playing") return;

  if (e.key === "ArrowLeft" && player.targetLane > 0) player.targetLane--;
  if (e.key === "ArrowRight" && player.targetLane < 2) player.targetLane++;
});

canvas.addEventListener("click", () => {
  if (state === "start" || state === "gameOver") {
    resetGame();
    state = "playing";
  }
});

// =================
// DESENHO
// =================
function drawBackground() {

  // areia base
  ctx.fillStyle = "#e6d3a3";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // =================
  // NAVIO (ESQUERDA)
  // =================
  tankerY += 0.3;
  if (tankerY > canvas.height) tankerY = -220;

  let shipX = 30;

  for (let i = -1; i < 2; i++) {
    let y = tankerY + i * 220;

    ctx.fillStyle = "#2b2b2b";
    ctx.fillRect(shipX, y, 80, 180);

    ctx.fillStyle = "#444";
    ctx.fillRect(shipX + 10, y + 20, 60, 20);
    ctx.fillRect(shipX + 10, y + 70, 60, 20);
    ctx.fillRect(shipX + 10, y + 120, 60, 20);

    ctx.fillStyle = "#777";
    ctx.fillRect(shipX + 25, y + 140, 30, 25);
  }

  // =================
  // PRAIA (DIREITA)
  // =================
  for (let item of beachItems) {

    if (item.type === "rock") {
      ctx.fillStyle = "#777";
      ctx.beginPath();
      ctx.arc(item.x, item.y, 10, 0, Math.PI * 2);
      ctx.fill();
    }

    if (item.type === "palm") {
      ctx.fillStyle = "#8b5a2b";
      ctx.fillRect(item.x, item.y, 5, 22);

      ctx.strokeStyle = "#2f8f3a";
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(item.x + 2, item.y);
      ctx.lineTo(item.x - 12, item.y - 10);
      ctx.moveTo(item.x + 2, item.y);
      ctx.lineTo(item.x + 12, item.y - 10);
      ctx.moveTo(item.x + 2, item.y);
      ctx.lineTo(item.x - 8, item.y - 16);
      ctx.moveTo(item.x + 2, item.y);
      ctx.lineTo(item.x + 8, item.y - 16);
      ctx.stroke();
    }
  }
}

// =================
// ÁGUA
// =================
function drawWater() {
  for (let y = 0; y < gameHeight; y += 12) {
    ctx.fillStyle = y % 24 === 0 ? "#2fa4b7" : "#2895a6";
    ctx.fillRect(gameX, y, gameWidth, 12);
  }
}

// =================
// PEIXE
// =================
function drawFish() {
  if (!player) return;

  ctx.globalAlpha = player.opacity;

  ctx.fillStyle = player.isSkeleton ? "#ccc" : "#e6f7ff";

  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size/2, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = player.isSkeleton ? "#999" : "#fff";
  ctx.fillRect(player.x - 7, player.y, 7, 5);

  ctx.globalAlpha = 1;
}

// =================
// ÓLEO
// =================
function drawOil(o) {
  let x = gameX + o.lane * laneWidth + laneWidth/2;

  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.ellipse(x, o.y, 16, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#444";
  ctx.beginPath();
  ctx.ellipse(x - 4, o.y - 2, 6, 3, 0, 0, Math.PI * 2);
  ctx.fill();
}

// =================
// UI
// =================
function drawStart() {
  ctx.fillStyle = "black";
  ctx.textAlign = "center";

  ctx.font = "28px monospace";
  ctx.fillText("PRAIA NO POTE", canvas.width/2, canvas.height/2 - 20);

  ctx.font = "16px monospace";

  if (Math.floor(blinkTimer / 30) % 2 === 0) {
    ctx.fillText("clique para começar", canvas.width/2, canvas.height/2 + 20);
  }
}

function drawGameOver() {
  ctx.fillStyle = "black";
  ctx.textAlign = "center";

  ctx.font = "26px monospace";
  ctx.fillText("GAME OVER", canvas.width/2, canvas.height/2 - 20);

  ctx.font = "16px monospace";
  ctx.fillText("score: " + score, canvas.width/2, canvas.height/2 + 10);
}

// =================
// LOOP
// =================
function update() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  blinkTimer++;

  drawBackground();
  drawWater();

  if (state === "start") {
    drawStart();
    requestAnimationFrame(update);
    return;
  }

  if (player) {
    let targetX = gameX + player.targetLane * laneWidth + laneWidth/2;
    player.x += (targetX - player.x) * 0.2;
  }

  for (let o of obstacles) {
    if (state === "playing") o.y += speed;
    drawOil(o);

    if (
      state === "playing" &&
      o.lane === player.targetLane &&
      o.y > player.y - 10 &&
      o.y < player.y + 10
    ) {
      state = "dying";
      deathTimer = 0;
    }
  }

  obstacles = obstacles.filter(o => o.y < canvas.height);

  if (state === "playing") {
    spawnTimer++;
    if (spawnTimer > spawnInterval) {
      spawnRow();
      spawnTimer = 0;
    }

    scoreTimer++;
    if (scoreTimer > 180) {
      score++;
      scoreTimer = 0;
    }

    speed += 0.00015;
  }

  if (state === "dying") {
    deathTimer++;

    if (deathTimer < 40) player.y += 2;
    else if (deathTimer < 70) player.opacity -= 0.03;
    else if (deathTimer < 120) {
      if (!player.isSkeleton) {
        player.isSkeleton = true;
        player.y = player.baseY + 20;
        player.opacity = 1;
      }
      player.y -= 0.6;
    } else state = "gameOver";
  }

  drawFish();

  if (state === "playing" || state === "dying") {
    ctx.fillStyle = "black";
    ctx.fillText("score: " + score, gameX + 10, 20);
  }

  if (state === "gameOver") drawGameOver();

  requestAnimationFrame(update);
}

update();
</script>
</body>
</html>
