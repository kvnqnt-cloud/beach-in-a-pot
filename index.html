<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Praia no Pote</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: monospace;
      color: white;
    }

    canvas {
      display: block;
      margin: auto;
      background: #111;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="712" height="400"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// área do jogo
const gameWidth = 220;
const gameHeight = 360;
const gameX = (canvas.width - gameWidth) / 2;
const gameY = (canvas.height - gameHeight) / 2;

const laneWidth = gameWidth / 3;

let state = "start";

let player, obstacles, speed, score;
let spawnTimer = 0;
let spawnInterval = 90;
let scoreTimer = 0;
let deathTimer = 0;
let blinkTimer = 0;

// reset
function resetGame() {
  player = {
    lane: 1,
    targetLane: 1,
    x: gameX + laneWidth * 1 + laneWidth/2 - 10,
    y: gameY + gameHeight - 60,
    size: 20
  };

  obstacles = [];
  speed = 2;
  score = 0;
  spawnTimer = 0;
  spawnInterval = 90;
  scoreTimer = 0;
  deathTimer = 0;
}

// padrões de obstáculos
function spawnRow() {
  const patterns = [
    [1,0,1],
    [0,1,0],
    [1,0,0],
    [0,0,1],
    [0,1,1],
    [1,1,0]
  ];

  const pattern = patterns[Math.floor(Math.random() * patterns.length)];

  for (let lane = 0; lane < 3; lane++) {
    if (pattern[lane] === 1) {
      obstacles.push({
        lane: lane,
        y: gameY - 30,
        size: 20
      });
    }
  }
}

// controle
document.addEventListener("keydown", (e) => {
  if (state !== "playing") return;

  if (e.key === "ArrowLeft" && player.targetLane > 0) {
    player.targetLane--;
  }
  if (e.key === "ArrowRight" && player.targetLane < 2) {
    player.targetLane++;
  }
});

// clique
canvas.addEventListener("click", () => {
  if (state === "start") {
    resetGame();
    state = "playing";
  } else if (state === "gameOver") {
    resetGame();
    state = "playing";
  }
});

// telas
function drawStartScreen() {
  ctx.fillStyle = "white";
  ctx.textAlign = "center";

  ctx.font = "28px monospace";
  ctx.fillText("PRAIA NO POTE", gameX + gameWidth/2, canvas.height/2 - 20);

  ctx.font = "14px monospace";

  // texto piscando
  if (Math.floor(blinkTimer / 30) % 2 === 0) {
    ctx.fillText("clique para começar", gameX + gameWidth/2, canvas.height/2 + 20);
  }
}

function drawGameOver() {
  ctx.fillStyle = "white";
  ctx.textAlign = "center";

  ctx.font = "24px monospace";
  ctx.fillText("GAME OVER", gameX + gameWidth/2, canvas.height/2 - 20);

  ctx.font = "14px monospace";
  ctx.fillText("score: " + score, gameX + gameWidth/2, canvas.height/2 + 10);

  ctx.fillText("clique para jogar novamente", gameX + gameWidth/2, canvas.height/2 + 40);
}

// loop principal
function update() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  blinkTimer++;

  // fundo
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // área do jogo
  ctx.fillStyle = "#111";
  ctx.fillRect(gameX, gameY, gameWidth, gameHeight);

  if (state === "start") {
    drawStartScreen();
    requestAnimationFrame(update);
    return;
  }

  // movimento suave do player
  let targetX = gameX + player.targetLane * laneWidth + laneWidth/2 - player.size/2;
  player.x += (targetX - player.x) * 0.2;

  // desenhar player
  ctx.fillStyle = "white";
  ctx.fillRect(player.x, player.y, player.size, player.size);

  // obstáculos
  for (let i = 0; i < obstacles.length; i++) {
    let o = obstacles[i];
    let ox = gameX + o.lane * laneWidth + laneWidth/2 - o.size/2;

    if (state === "playing") {
      o.y += speed;
    }

    ctx.fillStyle = "red";
    ctx.fillRect(ox, o.y, o.size, o.size);

    // colisão
    if (
      state === "playing" &&
      o.lane === player.targetLane &&
      o.y + o.size > player.y &&
      o.y < player.y + player.size
    ) {
      state = "dying";
      deathTimer = 0;
    }
  }

  // limpar fora da tela
  obstacles = obstacles.filter(o => o.y < gameY + gameHeight);

  // estado PLAYING
  if (state === "playing") {

    spawnTimer++;
    if (spawnTimer > spawnInterval) {
      spawnRow();
      spawnTimer = 0;
    }

    if (spawnInterval > 55) {
      spawnInterval -= 0.003;
    }

    // SCORE MUITO LENTO (≈3s por ponto)
    scoreTimer++;
    if (scoreTimer > 180) {
      score++;
      scoreTimer = 0;
    }

    // velocidade
    speed += 0.00015;
  }

  // estado DYING
  if (state === "dying") {
    deathTimer++;

    // (placeholder de animação — depois você troca por afundar/esqueleto)
    player.y += 1;

    if (deathTimer > 120) {
      state = "gameOver";
    }
  }

  // UI score (sempre visível durante jogo e morte)
  if (state === "playing" || state === "dying") {
    ctx.fillStyle = "white";
    ctx.textAlign = "left";
    ctx.fillText("score: " + score, gameX + 10, gameY + 20);
  }

  // overlay game over (por cima do fundo congelado)
  if (state === "gameOver") {
    drawGameOver();
  }

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
